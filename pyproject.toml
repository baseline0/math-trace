[project]
name = "math-trace"
version = "0.1.0"
description = "Formula-to-code traceability for publication-quality mathematical documents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Alexiuk", email = "malexiuk@gmail.com" }]
requires-python = ">=3.13"
keywords = [
    "mathematics",
    "research",
    "formulas",
    "typst",
    "sympy",
    "publication",
    "traceability",
    "formal-verification",
    "lean",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "scipy>=1.18.1",
    "pdfplumber>=0.10.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "requests>=2.28.0",
    "arxiv>=2.0.0",
    "latex2sympy2>=1.9.1",
    "beautifulsoup4>=4.11.0",
]

[project.urls]
Homepage = "https://github.com/baseline0/math-trace"
Repository = "https://github.com/baseline0/math-trace"
Documentation = "https://github.com/baseline0/math-trace#readme"
"Bug Tracker" = "https://github.com/baseline0/math-trace/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_trace"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: deterministic, isolated, no external dependencies (runs in CI)",
    "integration: requires sibling repos or local setup (skip in CI, run locally)",
    "e2e: end-to-end tests of a whole workflow",
]
addopts = "-v --tb=short --strict-markers --cov=src/math_trace --cov-report=term-missing"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", ".git", "__pycache__", "dist", "build", ".pytest_cache", ".mypy_cache", ".ruff_cache"]
# Markdown is not ruff territory: ruff 0.16 would reformat Python snippets inside it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4", "N", "RUF", "SIM", "TID"]
ignore = ["E501", "SIM105", "N818", "RUF001", "RUF002", "RUF022"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"argparse".msg = "Use typer for CLIs (fleet mandate)."

[tool.ruff.lint.per-file-ignores]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; E741: single-letter symbols (I, l) are standard compartment and matrix notation; F841: pre-existing unused locals (multi-value unpacking, diagnostics); removing them could change behaviour
"examples/epidemiology-sir/build_paper.py" = ["N806", "E741", "F841"]
# N816: mixed-case rate-equation globals mirror the published model notation; E741: single-letter symbols (I, l) are standard compartment and matrix notation
"examples/epidemiology-sir/src/model.py" = ["N816", "E741"]
# N803: uppercase argument names are the public keyword API and mirror the paper notation; N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; E741: single-letter symbols (I, l) are standard compartment and matrix notation
"examples/epidemiology-sir/src/simulate.py" = ["N803", "N806", "E741"]
# E741: single-letter symbols (I, l) are standard compartment and matrix notation; F841: pre-existing unused locals (multi-value unpacking, diagnostics); removing them could change behaviour
"scripts/check_typst.py" = ["E741", "F841"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions
"src/math_trace/formula_browser.py" = ["N806"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions
"templates/biochemistry/build_paper.py" = ["N806"]
# N803: uppercase argument names are the public keyword API and mirror the paper notation; N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions
"templates/biochemistry/simulate.py" = ["N803", "N806"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions
"templates/biochemistry/src/model.py" = ["N806"]
# N803: uppercase argument names are the public keyword API and mirror the paper notation; N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; F841: pre-existing unused locals (multi-value unpacking, diagnostics); removing them could change behaviour
"templates/control-systems/simulate.py" = ["N803", "N806", "F841"]
# N803: uppercase argument names are the public keyword API and mirror the paper notation; N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; E741: single-letter symbols (I, l) are standard compartment and matrix notation
"templates/control-systems/src/model.py" = ["N803", "N806", "E741"]
# N803: uppercase argument names are the public keyword API and mirror the paper notation; N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; TID252: template files use relative imports for their in-place layout; TODO: convert to absolute imports
"templates/control-systems/src/scenarios/dc_motor.py" = ["N803", "N806", "TID252"]
# TID252: template files use relative imports for their in-place layout; TODO: convert to absolute imports; F841: pre-existing unused locals (multi-value unpacking, diagnostics); removing them could change behaviour
"templates/control-systems/src/tests/test_dc_motor_contract.py" = ["TID252", "F841"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions
"templates/epidemiology/build_paper.py" = ["N806"]
# N803: uppercase argument names are the public keyword API and mirror the paper notation; N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; E741: single-letter symbols (I, l) are standard compartment and matrix notation
"templates/epidemiology/simulate.py" = ["N803", "N806", "E741"]
# N803: uppercase argument names are the public keyword API and mirror the paper notation; N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; E741: single-letter symbols (I, l) are standard compartment and matrix notation; SIM108: if/else branches document SIR vs SEIR and are clearer than a ternary; RUF003: Greek letters and x-signs in comments mirror the equations
"templates/epidemiology/src/model.py" = ["N803", "N806", "E741", "SIM108", "RUF003"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; E741: single-letter symbols (I, l) are standard compartment and matrix notation; TID252: template files use relative imports for their in-place layout; TODO: convert to absolute imports; F841: pre-existing unused locals (multi-value unpacking, diagnostics); removing them could change behaviour; RUF003: Greek letters and x-signs in comments mirror the equations
"templates/epidemiology/src/scenarios/covid_sir.py" = ["N806", "E741", "TID252", "F841", "RUF003"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; TID252: template files use relative imports for their in-place layout; TODO: convert to absolute imports
"templates/epidemiology/src/tests/test_sir_model.py" = ["N806", "TID252"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions
"templates/gnns/simulate.py" = ["N806"]
# N803: uppercase argument names are the public keyword API and mirror the paper notation; RUF003: Greek letters and x-signs in comments mirror the equations
"templates/gnns/src/model.py" = ["N803", "RUF003"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; TID252: template files use relative imports for their in-place layout; TODO: convert to absolute imports
"templates/gnns/src/scenarios/karate_club.py" = ["N806", "TID252"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; E731: lambda assignments are scenario-specific callables kept as written; TID252: template files use relative imports for their in-place layout; TODO: convert to absolute imports; F841: pre-existing unused locals (multi-value unpacking, diagnostics); removing them could change behaviour
"templates/quantum-systems/src/scenarios/harmonic_oscillator.py" = ["N806", "E731", "TID252", "F841"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; TID252: template files use relative imports for their in-place layout; TODO: convert to absolute imports; F841: pre-existing unused locals (multi-value unpacking, diagnostics); removing them could change behaviour
"templates/quantum-systems/src/tests/test_harmonic_oscillator.py" = ["N806", "TID252", "F841"]
# N803/N806: uppercase arguments and locals (V, H, N) are the physics notation of the operators and potentials
"templates/quantum-systems/src/model.py" = ["N803", "N806"]
# N803/N806: uppercase symbols mirror the equations (S, I, R, V_0, C_v); TID252: template files use relative imports for their in-place layout
"templates/*/src/scenarios/*.py" = ["N803", "N806", "TID252"]
"templates/*/src/tests/*.py" = ["N803", "N806", "TID252"]
# F401: conditional import: FormulaPipeline is an availability probe for the try/except fallback
"templates/simple-physics/build_paper.py" = ["F401"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions
"templates/simple-physics/src/model.py" = ["N806"]
# N803: uppercase argument names are the public keyword API and mirror the paper notation; N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions
"templates/thermodynamics/simulate.py" = ["N803", "N806"]
# N803: uppercase argument names are the public keyword API and mirror the paper notation; N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions
"templates/thermodynamics/src/model.py" = ["N803", "N806"]
# N803: uppercase argument names are the public keyword API and mirror the paper notation; N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; TID252: template files use relative imports for their in-place layout; TODO: convert to absolute imports
"templates/thermodynamics/src/scenarios/ideal_gas.py" = ["N803", "N806", "TID252"]
# F841: pre-existing unused locals (multi-value unpacking, diagnostics); removing them could change behaviour
"tests/integration/test_template_builds.py" = ["F841"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions; E741: single-letter symbols (I, l) are standard compartment and matrix notation
"tests/unit/test_generators.py" = ["N806", "E741"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions
"tests/unit/test_gnns_model.py" = ["N806"]
# N806: uppercase local symbols (S, I, R, V_max, ...) mirror the equations; renaming risks collisions
"tests/unit/test_thermodynamics_model.py" = ["N806"]

[tool.pyright]
include = ["src", "tests"]
# The membrane tests import the example's model and simulate modules by inserting this path into sys.path.
extraPaths = ["examples/membrane-dynamics/src"]
typeCheckingMode = "standard"
pythonVersion = "3.13"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "ruff==0.16.8",
    "pyright>=1.1.300",
    "httpx>=0.24.0",
    "pre-commit>=4.6.2",
    "commitmate>=1.1.0",
    "pytest-json-report>=1.5.0",
    "jsonschema>=4.26.0",
]

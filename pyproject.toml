[project]
name = "math-trace"
version = "0.1.0"
description = "Formula-to-code traceability for publication-quality mathematical documents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Alexiuk", email = "malexiuk@gmail.com" }]
requires-python = ">=3.13"
keywords = [
    "mathematics",
    "research",
    "formulas",
    "typst",
    "sympy",
    "publication",
    "traceability",
    "formal-verification",
    "lean",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "scipy>=1.18.1",
    "pdfplumber>=0.10.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "requests>=2.28.0",
    "arxiv>=2.0.0",
    "latex2sympy2>=1.9.1",
    "beautifulsoup4>=4.11.0",
]

[project.scripts]
math-trace = "math_trace.cli:main"

[project.urls]
Homepage = "https://github.com/baseline0/math-trace"
Repository = "https://github.com/baseline0/math-trace"
Documentation = "https://github.com/baseline0/math-trace#readme"
"Bug Tracker" = "https://github.com/baseline0/math-trace/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_trace"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "unit: deterministic, isolated, no external dependencies (runs in CI)",
    "integration: requires sibling repos or local setup (skip in CI, run locally)",
]
addopts = "-v --tb=short --cov=src/math_trace --cov-report=term-missing"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", ".git", "__pycache__", "dist", "build", ".pytest_cache", ".mypy_cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E731",   # do not assign lambda (lambda potentials in quantum scenarios acceptable)
    "E741",   # ambiguous variable name (I, S, R, etc. standard in scientific code)
    "F401",   # imported but unused (template builder imports are conditional)
    "F841",   # local variable assigned but never used (common in scientific code with multiple results)
    "N802",   # invalid function name (exceptions exist)
    "N803",   # argument name should be lowercase (scientific variables are uppercase)
    "N816",   # variable in global scope should not be mixedCase (ode rate equations)
    "N806",   # invalid variable name (scientific notation: S, I, R acceptable)
    "RUF001", # ambiguous unicode in strings (Greek letters, math symbols standard in science)
    "RUF002", # ambiguous unicode in docstrings (Greek letters, math symbols standard in science)
    "RUF003", # ambiguous unicode in comments (Greek letters, math symbols standard in science)
    "RUF013", # PEP 484 prohibits implicit Optional (common default arg pattern)
    "SIM105", # suppress contextlib.suppress (not always clearer)
    "SIM108", # use ternary operator (explicit if-else clearer in some contexts)
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.13"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pyright>=1.1.300",
    "httpx>=0.24.0",
    "pre-commit>=4.6.2",
]

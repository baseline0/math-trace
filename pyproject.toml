[project]
name = "math-trace"
version = "0.1.0"
description = "Formula-to-code traceability for publication-quality mathematical documents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Alexiuk", email = "malexiuk@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "mypy>=1.5",
]

[project.urls]
Repository = "https://github.com/baseline0/math-trace"
Documentation = "https://github.com/baseline0/math-trace#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_trace"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

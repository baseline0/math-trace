[project]
name = "math-trace"
version = "0.1.0"
description = "Formula-to-code traceability for publication-quality mathematical documents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Alexiuk", email = "malexiuk@gmail.com" }]
requires-python = ">=3.13"
keywords = [
    "mathematics",
    "research",
    "formulas",
    "typst",
    "sympy",
    "publication",
    "traceability",
    "formal-verification",
    "lean",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "scipy>=1.18.1",
    "pdfplumber>=0.10.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "requests>=2.28.0",
    "arxiv>=2.0.0",
    "latex2sympy2>=1.9.1",
    "beautifulsoup4>=4.11.0",
]

[project.scripts]
math-trace = "math_trace.cli:main"

[project.urls]
Homepage = "https://github.com/baseline0/math-trace"
Repository = "https://github.com/baseline0/math-trace"
Documentation = "https://github.com/baseline0/math-trace#readme"
"Bug Tracker" = "https://github.com/baseline0/math-trace/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_trace"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "unit: deterministic, isolated, no external dependencies (runs in CI)",
    "integration: requires sibling repos or local setup (skip in CI, run locally)",
]
addopts = "-v --tb=short --cov=src/math_trace --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear (security-sensitive patterns)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security issues: hardcoded passwords, SQL injection, etc.)
    "A",    # flake8-builtins (prevent shadowing builtins)
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.flake8-bandit]
# Bandit security rules to catch common issues
# S101: use of assert (often used in tests, so selectively ignored)
skips = ["S101"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.13"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pyright>=1.1.300",
]

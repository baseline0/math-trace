[project]
name = "math-trace"
version = "0.1.0"
description = "Formula-to-code traceability for publication-quality mathematical documents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Alexiuk", email = "malexiuk@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "mathematics",
    "research",
    "formulas",
    "typst",
    "sympy",
    "publication",
    "traceability",
    "formal-verification",
    "lean",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/baseline0/math-trace"
Repository = "https://github.com/baseline0/math-trace"
Documentation = "https://github.com/baseline0/math-trace#readme"
"Bug Tracker" = "https://github.com/baseline0/math-trace/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_trace"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

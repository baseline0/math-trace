# Fleet-standard precommit configuration
# Stages:
#   pre-commit (default): Fast checks that block commits (syntax, linting, security)
#   pre-push: Slower checks that block pushes (unit tests)
#
# Priority levels:
#   [P0] Critical: Safety and architecture enforcement
#   [P1] High: Code quality and governance
#   [P2] Medium: Style and formatting
#   [P3] Low: Whitespace and hygiene

default_stages:
  - pre-commit
default_install_hook_types:
  - pre-commit
repos:
  # ===== Third-party: Standard Checks =====
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # P3: Hygiene
      - id: trailing-whitespace
        stages: [pre-commit]
        args: [--markdown-linebreak-ext=md]
        name: "[P3] Trim trailing whitespace"
      - id: end-of-file-fixer
        stages: [pre-commit]
        name: "[P3] Fix end of file"
      - id: check-case-conflict
        name: "[P3] Check for case conflicts"
      - id: check-merge-conflict
        name: "[P3] Check for merge conflicts"
      - id: mixed-line-ending
        name: "[P3] Fix mixed line endings"

      # P2: Format validation
      - id: check-toml
        name: "[P2] Validate TOML"
      - id: check-yaml
        name: "[P2] Validate YAML"
        args: [--unsafe]

      # P1: Architecture
      - id: detect-private-key
        name: "[P1] Detect private keys"
      - id: check-added-large-files
        name: "[P1] Check for large files"
        args: ["--maxkb=1000"]
      - id: check-ast
        name: "[P1] Check Python syntax"

  # ===== Third-party: Code Quality =====
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        name: "[P2] Lint with ruff"
        args: [--fix]
      - id: ruff-format
        name: "[P2] Format with ruff"

  - repo: https://github.com/rhysd/actionlint
    rev: v1.6.26
    hooks:
      - id: actionlint
        name: "[P1] Validate GitHub Actions workflows"
        files: ^\.github/workflows/.*\.ya?ml$

  # ===== Local: Custom Checks =====
  - repo: local
    hooks:
      # ----- P0: Critical Safety -----
      - id: regenerate-autogenerated
        name: "[P0] Regenerate autogenerated files from Typer CLI"
        entry: bash scripts/regenerate-autogen.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        fail_fast: true

      - id: prevent-direct-secrets
        name: "[P0] Prevent .env and secrets in src"
        entry: bash -c 'find src tests -name ".env*" -o -name "*.key" -o -name "*.pem" | grep -q . && { echo "❌ Found secrets in src/tests"; exit 1; } || exit 0'
        language: system
        stages: [pre-commit]
        pass_filenames: false

      - id: check-no-env-in-dist
        name: "[P0] Check no .env files in dist"
        entry: bash -c 'if [ -d dist ]; then find dist -name ".env*" -exec echo "❌ Found {} in dist/" \; -exec false \; ; fi'
        language: system
        stages: [pre-commit]
        pass_filenames: false

      # ----- P1: Code Quality & Architecture -----
      - id: python-syntax-check
        name: "[P1] Check Python syntax (all files)"
        entry: uv run python -m py_compile
        language: system
        types: [python]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: repo-root-pattern
        name: "[P1] Enforce REPO_ROOT pattern (no .parent outside constants.py)"
        entry: fleet hook --name check-repo-root-pattern
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: check-argparse-prohibition
        name: "[P1] No argparse: CLIs use Typer"
        entry: fleet hook --name check-argparse-prohibition
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: check-project-venv
        name: "[P0] VIRTUAL_ENV must be this repo's .venv"
        entry: fleet hook --name check-project-venv
        language: system
        pass_filenames: false
        always_run: true
  - repo: local
    hooks:
      - id: uv-lock-check
        name: "[P1] uv.lock matches pyproject.toml (read-only; run uv lock to fix)"
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: template-equation-metadata
        name: "[P1] Templates: model.py defines export_equation_metadata and equations.json matches it"
        entry: uv run python -m math_trace.template_metadata
        language: system
        pass_filenames: false
        files: '^templates/[^/]+/(src/model\.py|equations\.json)$'
        stages: [pre-commit]
      - id: check-typer-explicit
        name: "[P1] typer commands take required --name value options (ratchet against baseline)"
        entry: fleet typer-explicit check --root . --baseline .typer-explicit-baseline.json
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vendored-fleet-clean
        name: "[P1] just/fleet-clean.just matches fleet-base (hand edits fail)"
        entry: just check-fleet-clean
        language: system
        pass_filenames: false
        files: '^(just/fleet-clean\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vendored-fleet-commit
        name: "[P1] just/fleet-commit.just matches fleet-base (hand edits fail)"
        entry: just check-fleet-commit
        language: system
        pass_filenames: false
        files: '^(just/fleet-commit\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vendored-repo-push
        name: "[P1] just/repo-push.just matches fleet-base (hand edits fail)"
        entry: just check-repo-push
        language: system
        pass_filenames: false
        files: '^(just/repo-push\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vendored-fleet-checks
        name: "[P1] just/fleet-checks.just matches fleet-base (hand edits fail)"
        entry: just check-fleet-checks
        language: system
        pass_filenames: false
        files: '^(just/fleet-checks\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vendored-fleet-test
        name: "[P1] just/fleet-test.just matches fleet-base (hand edits fail)"
        entry: just check-fleet-test
        language: system
        pass_filenames: false
        files: '^(just/fleet-test\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vendored-revision
        name: "[P1] vendored just copies name one fleet-base revision (commit)"
        entry: bash -c 'h=$(grep -h "Vendored from fleet-base @" just/fleet-clean.just just/fleet-commit.just just/repo-push.just just/fleet-checks.just just/fleet-test.just 2>/dev/null); total=$(printf "%s\n" "$h" | grep -c .); distinct=$(printf "%s\n" "$h" | sort -u | grep -c .); [ "$total" -eq 5 ] && [ "$distinct" -eq 1 ] || { echo "vendored just copies must be five and name one fleet-base revision (found $total, $distinct revisions); reinstall them from one release" >&2; exit 1; }'
        language: system
        pass_filenames: false
        files: '^(just/(fleet-clean|fleet-commit|repo-push|fleet-checks|fleet-test)\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: no-latex-guard
        name: "[P1] No LaTeX: ADR-301 chose Typst (tests/unit/test_latex_guard.py)"
        entry: uv run pytest tests/unit/test_latex_guard.py -q --no-cov -p no:cacheprovider
        language: system
        pass_filenames: false
        files: '(\.py|\.tex|\.sh|\.ya?ml|\.toml)$|^justfile$'
        stages: [pre-commit]

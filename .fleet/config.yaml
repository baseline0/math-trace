name: math-trace
enabled: true
description: Formula-to-code traceability framework for research papers
governance:
  auto_fix: true
  fixable_categories:
  - environment
  - config
  - discovery
  requires_review:
  - code
  - breaking_changes
templates:
  auto_validate: true
  validation_schedule: on-commit
  tracking:
    enabled: true
    index_file: .fleet/templates.json
mcp:
  rope_mcp:
    enabled: true
    tasks:
    - extract_formula_helpers
    - unify_build_scripts
  vscode_mcp:
    enabled: true
    workspaces:
    - name: all-templates
      pattern: templates/*/model.py
      task: batch-update-sympy-exports
cost_tracking:
  enabled: true
  mcp_operations:
  - extract_formula_helpers
  - unify_build_scripts
  - batch_refactor_templates
  maintenance_categories:
  - template-validation
  - dependency-updates
  - ci-cd-maintenance
  - documentation-sync
audit:
  enabled: true
  log_location: .fleet/audit.log
  log_events:
  - agent_action
  - mcp_invocation
  - policy_decision
  - template_addition
  - dependency_update
maintenance:
  weekly:
  - task: validate-all-templates
    day: monday
    time: 09:00
  monthly:
  - task: sync-template-docs
    day: '1'
    time: '10:00'
  - task: audit-dependencies
    day: '1'
    time: '11:00'
  quarterly:
  - task: review-template-coverage
    season: Q1,Q2,Q3,Q4
    time: '14:00'
integration:
  github_releases:
    enabled: true
    branch: main
    auto_push: true
  fleet_dashboard:
    enabled: true
    metrics:
    - template_count
    - template_pass_rate
    - dependency_versions
  palomar:
    enabled: true
    auto_register: false
    registry_base: https://palomar.ridge.ai
external:
  visibility:
  - README.md
  - templates/
  - examples/
  - docs/
  internal_only:
  - .fleet/
  - .fleet/audit.log
  - .fleet/templates.json
version: '1.0'
created: '2026-09-18'
maintained_by: mark-alexiuk
fleet_role: public-template-repo
schema_version: '1.0'

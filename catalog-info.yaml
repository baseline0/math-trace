apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: math-trace-generators
  description: SymPy to Typst/LaTeX formula converters
  tags:
    - sympy
    - typst
    - latex
spec:
  type: library
  lifecycle: active
  owner: group:research
  definition: |
    This API provides converters for transforming SymPy expressions
    into publication-ready LaTeX and Typst formats.

    Main classes:
    - SymPyToTypst: Convert expressions to Typst math notation
    - TypstEnvironmentBuilder: Build theorem/proof environments

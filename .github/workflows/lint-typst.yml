name: Lint Typst Files

on:
  push:
    branches: [main]
    paths:
      - '**/*.typ'
      - 'scripts/check_typst.py'
      - '.github/workflows/lint-typst.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.typ'
      - 'scripts/check_typst.py'

permissions:
  contents: read

jobs:
  typst-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        run: |
          curl -fsSL https://install.typst.community/install.sh | sh
          echo "$HOME/.typst/bin" >> $GITHUB_PATH

      - name: Verify Typst Installation
        run: typst --version

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Typst checks
        run: python scripts/check_typst.py

      - name: Report results
        if: success()
        run: |
          echo "✅ All Typst files passed syntax checks"
          echo ""
          echo "Summary:"
          echo "  - Typst compilation: ✅"
          echo "  - File references: ✅"
          echo "  - Syntax patterns: ✅"
          echo ""
          echo "See docs/TYPST-LINTING.md for details"

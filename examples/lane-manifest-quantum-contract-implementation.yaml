acceptance:
  - Eigenvalue contract: E_n = (n+1/2)ℏω validated to ≤0.1% relative error for n=0–4 at grid 512 points
  - Normalization contract: ∫|ψ|²dx = 1 ± 1e-6 for eigenstates and time-evolved states
  - Energy conservation: TDSE drift |E(t)−E(0)|/E(0) < 1e-6 (ω ≥ 1.0), < 1e-4 (ω < 1.0)
  - Uncertainty principle: Ground state Δx·Δp ≥ ℏ/2 − 1e-5
  - Expectation values: ⟨x⟩=0, ⟨p⟩=0 for eigenstates to ±1e-6
  - Numerical assumptions documented in PARAMETERS.md (FDM, SSFM, quadrature, finite-difference momentum, boundary conditions, tolerance justification)
  - Assumption documentation is explicit and consistent with current implementation
  - README updated with contract status section (links to test file, lists validated invariants)
  - Test coverage does not regress below current baseline (94% on src/model.py)
  - Repeated scenario execution produces identical outputs (floating-point precision)

